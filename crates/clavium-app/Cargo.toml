[package]
name = "clavium-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clavium-audio = { version = "0.1.0", path = "../clavium-audio" }
clavium-core = { version = "0.1.0", path = "../clavium-core" }
clavium-eval = { version = "0.1.0", path = "../clavium-eval" }
clavium-midi = { version = "0.1.0", path = "../clavium-midi" }
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.154"
ureq = "3.4.2"
zip = "9.0.2"

[dev-dependencies]
hound = "3.5.1"
midly = "0.5.3"

[build-dependencies]
winresource = "0.1.34"
